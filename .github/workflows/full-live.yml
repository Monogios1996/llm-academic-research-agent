name: full-live-workflow

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Academic research topic or question"
        required: true
        default: "How are LLM planning agents evaluated in academic research?"
        type: string
      objective:
        description: "Optional research objective"
        required: false
        default: "Identify evaluation approaches, datasets, and reliability considerations for LLM-based planning agents."
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
      TOPIC: ${{ inputs.topic }}
      OBJECTIVE: ${{ inputs.objective }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full live research workflow
        env:
          PYTHONPATH: src
        run: |
          if [ -n "$OBJECTIVE" ]; then
            python -m research_agent.main --topic "$TOPIC" --objective "$OBJECTIVE"
          else
            python -m research_agent.main --topic "$TOPIC"
          fi
